# Channel 1: one game process serving every map. ${NAME} values come from the environment (.env).
role = "game"
test_server = false

[log]
level = "info"
keep_days = 2

[database]
host = "mariadb"
user = "${DB_USER}"
password = "${DB_PASSWORD}"

[server]
hostname = "first"
channel = 1
port = 13000
p2p_port = 14000
db_host = "db"
proxy_ip = "${PUBLIC_IP}"
p2p_allowed_hosts = ["auth", "channel1-first"]
db_port = 15000
ping_seconds = 180

[server.admin]
ips = ["127.0.0.1"]
password = "${ADMIN_PASSWORD}"

[game]
map_allow = [
    1, 3, 4, 5, 6, 21, 23, 24, 25, 26, 41, 43, 44, 45, 46, 61, 62, 63, 64, 65, 66, 67, 68, 69, 70, 71,
    72, 73, 81, 100, 101, 103, 104, 105, 107, 108, 109, 110, 111, 112, 113, 114, 118, 119, 120, 121,
    122, 123, 124, 125, 126, 127, 128, 181, 182, 183, 200, 208, 216, 217, 301, 302, 303, 304, 351,
]
save_seconds = 180
view_range = 8000
max_level = 100
pk_protect_level = 15
mall_url = "google.com"

[game.anti_cheat]
check_multihack = false
speed_hack_limit = 300
speed_hack_bonus = 80
