x-server: &server
  image: localhost/metin2-server:linux
  build: .
  restart: unless-stopped
  stop_grace_period: 120s
  networks: [ metin2 ]
  environment: &server-environment
    DB_HOST: mariadb
    DB_PORT: "3306"
    DB_USER: ${DB_USER:?Set DB_USER in .env}
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    PUBLIC_IP: ${PUBLIC_IP:?Set PUBLIC_IP in .env}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}

services:
  mariadb:
    image: docker.io/library/mariadb:11.4
    restart: unless-stopped
    stop_grace_period: 120s
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./dist/mariadb/mariadb.cnf:/etc/mysql/conf.d/metin2.cnf:ro,Z
      - ./dist/mariadb/init-databases.sh:/docker-entrypoint-initdb.d/10-metin2.sh:ro,Z
      - ./dist/mariadb/dump:/metin2-dumps:ro,Z
    networks: [ metin2 ]
    healthcheck:
      test: [ CMD, healthcheck.sh, --connect, --innodb_initialized ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  db:
    <<: *server
    hostname: db
    command: [ db ]
    volumes:
      - db-data:/var/lib/metin2
      - ./dist/share:/srv/metin2/share:ro,z
      - ./dist/config/db:/srv/metin2/config:ro,Z
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: [ CMD, /opt/metin2/bin/metin2-runtime, health, "15000" ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  auth:
    <<: *server
    hostname: auth
    command: [ auth ]
    volumes:
      - auth-data:/var/lib/metin2
      - ./dist/share:/srv/metin2/share:ro,z
      - ./dist/config/auth:/srv/metin2/config:ro,Z
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "11000:11000/tcp"
    healthcheck:
      test: [ CMD, /opt/metin2/bin/metin2-runtime, health, "11000" ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  # One game process serving every map of the original channel 1 cores (first, game1, game2, game99).
  channel1-first:
    <<: *server
    hostname: channel1-first
    command: [ channel1-first ]
    volumes:
      - channel1-first-data:/var/lib/metin2
      - ./dist/share:/srv/metin2/share:ro,z
      - ./dist/config/channel1-first:/srv/metin2/config:ro,Z
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
    ports:
      - "13000:13000/tcp"
    healthcheck:
      test: [ CMD, /opt/metin2/bin/metin2-runtime, health, "13000" ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

networks:
  metin2:
    driver: bridge

volumes:
  mariadb-data:
  db-data:
  auth-data:
  channel1-first-data:
